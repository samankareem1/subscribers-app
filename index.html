<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المشتركين">
<meta name="theme-color" content="#0F1B2D">
<link rel="manifest" href='data:application/manifest+json,{"name":"%D8%A5%D8%AF%D8%A7%D8%B1%D8%A9%20%D8%A7%D9%84%D9%85%D8%B4%D8%AA%D8%B1%D9%83%D9%8A%D9%86","short_name":"%D8%A7%D9%84%D9%85%D8%B4%D8%AA%D8%B1%D9%83%D9%8A%D9%86","start_url":".","display":"standalone","background_color":"%230F1B2D","theme_color":"%230F1B2D","dir":"rtl","lang":"ar"}'>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230F1B2D'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23E8A33D' font-family='sans-serif'%3E%D9%85%3C/text%3E%3C/svg%3E">
<title>إدارة المشتركين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0F1B2D; --bg-elevated:#16263F; --bg-card:#1B2E4C; --border:#2B3F5E;
    --ink:#F4F1EA; --ink-dim:#A9B6CC; --gold:#E8A33D; --green:#4FAE83; --rust:#C1584B;
    --font-display:'Cairo', system-ui, sans-serif; --font-body:'Tajawal', system-ui, sans-serif;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit; margin:0; padding:0;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{height:100%; background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.6; -webkit-font-smoothing:antialiased;}
  .app{max-width:760px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}
  .hidden{display:none !important;}

  .auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-box{width:100%; max-width:380px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:20px; padding:28px 24px;}
  .auth-box h1{font-family:var(--font-display); font-weight:900; font-size:22px; text-align:center; margin-bottom:4px;}
  .auth-box p.sub{text-align:center; color:var(--ink-dim); font-size:13px; margin-bottom:22px;}
  .auth-tabs{display:flex; background:var(--bg); border-radius:12px; padding:4px; margin-bottom:20px; border:1px solid var(--border);}
  .auth-tab{flex:1; text-align:center; padding:9px; border-radius:9px; font-size:14px; cursor:pointer; color:var(--ink-dim); font-weight:700;}
  .auth-tab.active{background:var(--gold); color:#1A1204;}
  .auth-field{margin-bottom:13px;}
  .auth-field label{display:block; font-size:12.5px; color:var(--ink-dim); margin-bottom:5px;}
  .auth-field input{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--ink); border-radius:10px; padding:12px; font-family:var(--font-body); font-size:14.5px;}
  .auth-btn{width:100%; background:var(--gold); color:#1A1204; border:none; padding:13px; border-radius:12px; font-family:var(--font-display); font-weight:700; font-size:15px; cursor:pointer; margin-top:6px;}
  .auth-btn:disabled{opacity:.6;}
  .auth-msg{font-size:13px; text-align:center; margin-top:14px; padding:10px; border-radius:10px;}
  .auth-msg.error{background:rgba(193,88,75,.15); color:var(--rust);}
  .auth-msg.success{background:rgba(79,174,131,.15); color:var(--green);}

  header.top{padding:22px 20px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; background:var(--bg); padding-top:calc(22px + env(safe-area-inset-top,0px)); display:flex; justify-content:space-between; align-items:flex-start;}
  header.top h1{font-family:var(--font-display); font-weight:900; font-size:22px;}
  header.top p{color:var(--ink-dim); font-size:13.5px; margin-top:4px;}
  .brand-row{display:flex; align-items:center; gap:10px;}
  .brand-logo{width:38px; height:38px; border-radius:10px; object-fit:cover; border:1px solid var(--border);}
  .logout-btn{background:transparent; border:1px solid var(--border); color:var(--ink-dim); font-size:12.5px; padding:8px 12px; border-radius:10px; cursor:pointer; font-family:var(--font-body); white-space:nowrap;}
  .header-actions{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .icon-btn{background:transparent; border:1px solid var(--border); color:var(--ink-dim); font-size:12px; padding:8px 10px; border-radius:10px; cursor:pointer; font-family:var(--font-body); white-space:nowrap;}

  .reminder-banner{margin:0 20px 12px; background:rgba(232,163,61,.14); border:1px solid rgba(232,163,61,.4); border-radius:14px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .reminder-banner p{font-size:13px; color:var(--gold); font-weight:700;}
  .reminder-banner button{background:var(--gold); color:#1A1204; border:none; padding:9px 14px; border-radius:10px; font-family:var(--font-display); font-weight:700; font-size:12.5px; cursor:pointer; white-space:nowrap;}

  .big-overlay{position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:70;}
  .big-overlay.open{display:flex;}
  .big-overlay-header{padding:18px 20px; padding-top:calc(18px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  .big-overlay-header h2{font-family:var(--font-display); font-size:18px;}
  .big-overlay-body{flex:1; overflow-y:auto; padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));}
  .close-x{background:transparent; border:1px solid var(--border); color:var(--ink-dim); width:34px; height:34px; border-radius:10px; cursor:pointer; font-size:16px;}

  .reminder-item{background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .reminder-item .ri-name{font-family:var(--font-display); font-weight:700; font-size:14.5px;}
  .reminder-item .ri-sub{color:var(--ink-dim); font-size:12px; margin-top:2px;}
  .reminder-item button{background:var(--green); color:#0B241A; border:none; padding:9px 12px; border-radius:10px; font-family:var(--font-body); font-weight:700; font-size:12.5px; cursor:pointer; white-space:nowrap;}

  .analytics-cards{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px;}
  .a-card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center;}
  .a-card b{display:block; font-family:var(--font-display); font-size:19px;}
  .a-card span{font-size:11.5px; color:var(--ink-dim);}
  .chart-box{background:var(--bg-elevated); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:16px;}
  .chart-box h3{font-family:var(--font-display); font-size:14px; margin-bottom:12px;}

  .brand-form .field{margin-bottom:14px;}
  .brand-form label{display:block; font-size:12.5px; color:var(--ink-dim); margin-bottom:5px;}
  .brand-form input[type=text]{width:100%; background:var(--bg-elevated); border:1px solid var(--border); color:var(--ink); border-radius:10px; padding:11px 12px; font-family:var(--font-body); font-size:14.5px;}
  .brand-form input[type=color]{width:60px; height:40px; border-radius:10px; border:1px solid var(--border); background:none; cursor:pointer;}
  .brand-logo-preview{width:64px; height:64px; border-radius:14px; object-fit:cover; border:1px solid var(--border); margin-top:8px;}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:16px 20px;}
  .stat{background:var(--bg-elevated); border:1px solid var(--border); border-radius:14px; padding:12px 10px; text-align:center;}
  .stat b{display:block; font-family:var(--font-display); font-size:20px; font-weight:700;}
  .stat span{font-size:11px; color:var(--ink-dim);}
  .stat.warn b{color:var(--gold);} .stat.bad b{color:var(--rust);} .stat.good b{color:var(--green);}

  .controls{padding:4px 20px 12px; display:flex; flex-direction:column; gap:10px;}
  .search input{width:100%; background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px; padding:12px 14px; color:var(--ink); font-family:var(--font-body); font-size:14.5px;}
  .search input::placeholder{color:var(--ink-dim);}
  .search input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; background:transparent; border:1px solid var(--border); color:var(--ink-dim); padding:7px 14px; border-radius:999px; font-family:var(--font-body); font-size:13px; cursor:pointer; white-space:nowrap;}
  .tab.active{background:var(--gold); border-color:var(--gold); color:#1A1204; font-weight:700;}

  main{flex:1; padding:6px 20px 100px;}
  .empty{text-align:center; color:var(--ink-dim); padding:60px 20px; font-size:14px;}
  .empty b{display:block; font-family:var(--font-display); color:var(--ink); font-size:17px; margin-bottom:6px;}

  .card{background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:14px 16px; margin-bottom:10px; position:relative;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-name{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .card-type{color:var(--ink-dim); font-size:12.5px; margin-top:2px;}
  .badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; flex:0 0 auto;}
  .badge.active{background:rgba(79,174,131,.16); color:var(--green);}
  .badge.soon{background:rgba(232,163,61,.18); color:var(--gold);}
  .badge.expired{background:rgba(193,88,75,.18); color:var(--rust);}
  .card-meta{display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:10px; font-size:12.5px; color:var(--ink-dim);}
  .card-meta b{color:var(--ink); font-weight:600;}
  .debt-line{color:var(--rust); font-weight:700;}
  .card-actions{display:flex; gap:8px; margin-top:12px;}
  .card-actions button{flex:1; border:1px solid var(--border); background:var(--bg-elevated); color:var(--ink); padding:9px 8px; border-radius:10px; font-family:var(--font-body); font-size:12.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;}
  .card-actions button.wa{color:var(--green); border-color:rgba(79,174,131,.35);}
  .card-actions button.del{color:var(--rust); border-color:rgba(193,88,75,.35);}

  .fab{position:fixed; bottom:calc(24px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); max-width:760px; width:calc(100% - 40px); display:flex; justify-content:center; pointer-events:none;}
  .fab button{pointer-events:auto; background:var(--gold); color:#1A1204; border:none; font-family:var(--font-display); font-weight:700; font-size:14.5px; padding:14px 30px; border-radius:999px; box-shadow:0 10px 24px rgba(0,0,0,.35); cursor:pointer;}

  .sheet-overlay{position:fixed; inset:0; background:rgba(6,10,18,.6); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  .sheet-overlay.open{display:flex;}
  .sheet{background:var(--bg-elevated); width:100%; max-width:760px; border-radius:22px 22px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow-y:auto; border-top:1px solid var(--border);}
  .sheet h2{font-family:var(--font-display); font-size:18px; margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-dim); margin-bottom:5px;}
  .field input, .field textarea{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--ink); border-radius:10px; padding:11px 12px; font-family:var(--font-body); font-size:14.5px;}
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .sheet-actions button{flex:1; padding:13px; border-radius:12px; font-family:var(--font-display); font-weight:700; font-size:14.5px; border:none; cursor:pointer;}
  .btn-save{background:var(--gold); color:#1A1204;}
  .btn-cancel{background:transparent; border:1px solid var(--border)!important; color:var(--ink-dim);}

  .loading-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:14px;}

  .qr-overlay{position:fixed; inset:0; background:rgba(6,10,18,.85); display:none; align-items:center; justify-content:center; z-index:60; padding:24px;}
  .qr-overlay.open{display:flex;}
  .qr-box{background:var(--bg-elevated); border:1px solid var(--border); border-radius:20px; padding:22px; text-align:center; max-width:400px; width:100%;}
  .qr-box h3{font-family:var(--font-display); font-size:16px; margin-bottom:14px;}
  .qr-box img{max-width:100%; border-radius:12px; background:#fff;}
  .qr-close{margin-top:18px; width:100%; background:var(--gold); color:#1A1204; border:none; padding:12px; border-radius:12px; font-family:var(--font-display); font-weight:700; cursor:pointer;}
  .card-actions.with-qr button{font-size:11.5px; padding:9px 4px;}
  .barcode-preview{margin-top:8px; max-width:140px; border-radius:8px; display:block; border:1px solid var(--border);}
  .barcode-upload-row{display:flex; align-items:center; gap:10px;}

  .export-row{display:flex; gap:8px; padding:0 20px 12px;}
  .export-btn{flex:1; background:var(--bg-elevated); border:1px solid var(--border); color:var(--ink); padding:10px; border-radius:12px; font-family:var(--font-body); font-size:12.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;}

  .print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    .print-area, .print-area *{visibility:visible;}
    .print-area{display:block !important; position:absolute; top:0; right:0; width:100%; padding:16px; direction:rtl; background:#fff !important; color:#111 !important;}
    .print-area h2{font-family:'Cairo', sans-serif; margin-bottom:12px; color:#111 !important;}
    .print-area table{width:100%; border-collapse:collapse; font-family:'Tajawal', sans-serif;}
    .print-area th, .print-area td{border:1px solid #666; padding:6px 8px; font-size:11px; text-align:center; color:#111 !important;}
    .print-area th{background:#E8A33D !important; color:#1A1204 !important; font-weight:700; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .print-area tr:nth-child(even) td{background:#f4f4f4 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }

  @media (max-width:420px){ .stats{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">جاري التحميل...</div>

<div id="authScreen" class="auth-screen hidden">
  <div class="auth-box">
    <h1>إدارة المشتركين</h1>
    <p class="sub">سجّل دخولك لإدارة مشتركيك</p>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin">دخول</div>
      <div class="auth-tab" id="tabSignup">حساب جديد</div>
    </div>
    <div class="auth-field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="authEmail" placeholder="example@email.com">
    </div>
    <div class="auth-field">
      <label>كلمة المرور</label>
      <input type="password" id="authPassword" placeholder="6 أحرف على الأقل">
    </div>
    <button class="auth-btn" id="authSubmit">دخول</button>
    <div id="authMsg"></div>
  </div>
</div>

<div id="mainApp" class="app hidden">
  <header class="top">
    <div class="brand-row">
      <img id="brandLogo" class="brand-logo hidden" src="" alt="">
      <div>
        <h1 id="brandTitle">إدارة المشتركين</h1>
        <p id="brandSubtitle">متابعة الاشتراكات، المواعيد، والمستحقات</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="openAnalytics">📊 تحليلات</button>
      <button class="icon-btn" id="openBranding">⚙️ العلامة</button>
      <button class="logout-btn" id="logoutBtn">خروج</button>
    </div>
  </header>

  <div class="reminder-banner hidden" id="reminderBanner">
    <p id="reminderText"></p>
    <button id="openReminders">عرض والإرسال</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <div class="search"><input id="search" type="text" placeholder="ابحث بالاسم أو رقم الهاتف"></div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-filter="all">الكل</button>
      <button class="tab" data-filter="active">نشط</button>
      <button class="tab" data-filter="soon">قارب على الانتهاء</button>
      <button class="tab" data-filter="expired">منتهي</button>
      <button class="tab" data-filter="debt">عليهم دين</button>
    </div>
  </div>

  <div class="export-row">
    <button class="export-btn" id="exportExcelBtn">📊 تصدير Excel</button>
    <button class="export-btn" id="exportPdfBtn">🖨️ تصدير PDF</button>
  </div>

  <main id="list"></main>

  <div class="fab"><button id="openAdd">+ إضافة مشترك</button></div>
</div>

<div class="qr-overlay" id="qrOverlay">
  <div class="qr-box">
    <h3 id="qrName"></h3>
    <img id="qrImage" src="" alt="باركود الجهاز">
    <button class="qr-close" id="qrCloseBtn">إغلاق</button>
  </div>
</div>

<div class="print-area" id="printArea"></div>

<!-- نافذة التذكيرات -->
<div class="big-overlay" id="remindersOverlay">
  <div class="big-overlay-header">
    <h2>التذكيرات المستحقة</h2>
    <button class="close-x" id="closeReminders">✕</button>
  </div>
  <div class="big-overlay-body" id="remindersList"></div>
</div>

<!-- نافذة التحليلات -->
<div class="big-overlay" id="analyticsOverlay">
  <div class="big-overlay-header">
    <h2>لوحة التحليلات</h2>
    <button class="close-x" id="closeAnalytics">✕</button>
  </div>
  <div class="big-overlay-body">
    <div class="analytics-cards" id="analyticsCards"></div>
    <div class="chart-box"><h3>توزيع حالة الاشتراكات</h3><canvas id="statusChart"></canvas></div>
    <div class="chart-box"><h3>المشتركون حسب نوع الاشتراك</h3><canvas id="typeChart"></canvas></div>
  </div>
</div>

<!-- نافذة العلامة التجارية -->
<div class="big-overlay" id="brandingOverlay">
  <div class="big-overlay-header">
    <h2>العلامة التجارية</h2>
    <button class="close-x" id="closeBranding">✕</button>
  </div>
  <div class="big-overlay-body brand-form">
    <div class="field">
      <label>اسم النشاط التجاري (يظهر بدل "إدارة المشتركين")</label>
      <input type="text" id="brand-name" placeholder="مثال: مؤسسة النور للاتصالات">
    </div>
    <div class="field">
      <label>الشعار (اختياري)</label>
      <input type="file" id="brand-logo-file" accept="image/*">
      <img id="brandLogoPreview" class="brand-logo-preview hidden">
    </div>
    <div class="field">
      <label>اللون الرئيسي للتطبيق</label>
      <input type="color" id="brand-color" value="#E8A33D">
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="brandCancelBtn">إلغاء</button>
      <button class="btn-save" id="brandSaveBtn">حفظ</button>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">إضافة مشترك</h2>
    <input type="hidden" id="editId">
    <div class="field"><label>الاسم</label><input id="f-name" type="text" placeholder="مثال: أحمد محمد"></div>
    <div class="field"><label>رقم الهاتف (الرقم المحلي، مثال: 07701234567)</label><input id="f-phone" type="tel" placeholder="07701234567"></div>
    <div class="field"><label>نوع الاشتراك</label><input id="f-type" type="text" placeholder="مثال: قناة، تطبيق، محتوى"></div>
    <div class="row2">
      <div class="field"><label>تاريخ البدء</label><input id="f-start" type="date"></div>
      <div class="field"><label>تاريخ الانتهاء</label><input id="f-end" type="date"></div>

function daysUntil(dateStr){
  const end = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((end - today) / 86400000);
}
function getStatus(sub){
  const d = daysUntil(sub.end_date);
  if(d < 0) return 'expired';
  if(d <= SOON_DAYS) return 'soon';
  return 'active';
}
function getDebt(sub){
  const amount = parseFloat(sub.amount) || 0;
  const paid = parseFloat(sub.paid) || 0;
  return Math.max(0, amount - paid);
}
function statusLabel(status, days){
  if(status === 'expired') return `منتهي منذ ${Math.abs(days)} يوم`;
  if(status === 'soon') return days === 0 ? 'ينتهي اليوم' : `يتبقى ${days} يوم`;
  return 'نشط';
}

  }else if(!digits.startsWith('964')){
    digits = '964' + digits;
  }
  return digits;
}

function buildWhatsappLink(sub){
  const status = getStatus(sub);

  if(status === 'expired'){
    msg += `نود إعلامكم بأن اشتراككم في "${sub.type}" قد انتهى بتاريخ ${sub.end_date}. نرجو التجديد في أقرب وقت.`;
  }else{
    const d = daysUntil(sub.end_date);
    msg += `نود تذكيركم بأن اشتراككم في "${sub.type}" سينتهي خلال ${d} يوم (بتاريخ ${sub.end_date}). نرجو التجديد قبل الانتهاء.`;
  }
  if(debt > 0) msg += `\nكما نود التنويه إلى وجود مبلغ متبقٍ قدره ${debt.toLocaleString('ar')}.`;
  msg += `\nشكراً لكم.`;
  return `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
}

function matchesFilter(sub){

let currentBarcodeImage = null;

function compressImage(file, maxWidth = 900, quality = 0.72){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('f-barcode-photo').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;

async function exportExcel(){
  const headers = ['ت','الاسم','الهاتف','نوع الاشتراك','تاريخ البدء','تاريخ الانتهاء','الحالة','مبلغ الاشتراك','المدفوع','الدين المتبقي','ملاحظات'];

  const dataRows = subscribers.map((s, i) => [
    i + 1,
    s.name,
    s.phone || '',
    s.type || '',
    s.start_date || '',
    s.end_date,
    statusLabel(getStatus(s), daysUntil(s.end_date)),
    s.amount || 0,
    s.paid || 0,
    getDebt(s),
    s.notes || ''
  ]);

  const colWidths = headers.map((h, i) => {
    let max = h.length;
    dataRows.forEach(row => {
      const len = String(row[i] ?? '').length;
      if(len > max) max = len;
    });
    return Math.min(38, Math.max(6, max + 4));
  });

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('المشتركون', { views: [{ rightToLeft: true }] });
  ws.columns = colWidths.map(w => ({ width: w }));

  const reportDate = new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
  const titleRow = ws.addRow([`تاريخ سحب التقرير: ${reportDate}`]);
  ws.mergeCells(1, 1, 1, headers.length);
  titleRow.height = 22;
  titleRow.getCell(1).alignment = { horizontal: 'center', vertical: 'middle' };
  titleRow.getCell(1).font = { bold: true, italic: true, color: { argb: 'FF444444' } };

  const headerRow = ws.addRow(headers);
  headerRow.eachCell(cell => {
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8A33D' } };
    cell.font = { bold: true, color: { argb: 'FF1A1204' } };
    cell.alignment = { horizontal: 'center', vertical: 'middle' };
    cell.border = { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} };
  });

  dataRows.forEach((row, i) => {
    const r = ws.addRow(row);
    r.eachCell(cell => {
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
      cell.border = { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} };
      if(i % 2 === 1){ cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFF4F4F4'} }; }
    });
  });

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'المشتركون.xlsx';
  a.click();
  URL.revokeObjectURL(url);
}

function exportPdf(){
  const reportDate = new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
  let html = `<h2>قائمة المشتركين</h2>
    <p style="margin-bottom:10px; font-size:12px;">تاريخ سحب التقرير: ${reportDate}</p>
    <table><thead><tr>
      <th>ت</th><th>الاسم</th><th>الهاتف</th><th>النوع</th><th>ينتهي</th><th>الحالة</th><th>المبلغ</th><th>المدفوع</th><th>الدين</th>
    </tr></thead><tbody>`;
  subscribers.forEach((s, i) => {
    const status = getStatus(s);
    html += `<tr>
      <td>${i + 1}</td>
      <td>${escapeHtml(s.name)}</td>
      <td>${escapeHtml(s.phone || '')}</td>
      <td>${escapeHtml(s.type || '')}</td>
      <td>${s.end_date}</td>
      <td>${statusLabel(status, daysUntil(s.end_date))}</td>
      <td>${s.amount || 0}</td>
      <td>${s.paid || 0}</td>
      <td>${getDebt(s)}</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById('printArea').innerHTML = html;
  window.print();
}

        <div>
          <div class="ri-name">${escapeHtml(s.name)}</div>
          <div class="ri-sub">${statusLabel(status, days)} — ${escapeHtml(s.phone || 'لا يوجد رقم')}</div>
        </div>
        <button onclick="sendWhatsapp('${s.id}')">💬 إرسال</button>
      </div>`;
    }).join('');
  }
  document.getElementById('remindersOverlay').classList.add('open');
}
document.getElementById('openReminders').addEventListener('click', openRemindersModal);
document.getElementById('closeReminders').addEventListener('click', () => document.getElementById('remindersOverlay').classList.remove('open'));

/* ---------- التحليلات ---------- */
let statusChartInstance = null;
let typeChartInstance = null;

function openAnalyticsModal(){
  const totalCollected = subscribers.reduce((sum, s) => sum + (parseFloat(s.paid) || 0), 0);
  const totalExpected = subscribers.reduce((sum, s) => sum + (parseFloat(s.amount) || 0), 0);
  const totalDebt = subscribers.reduce((sum, s) => sum + getDebt(s), 0);

  document.getElementById('analyticsCards').innerHTML = `
    <div class="a-card"><b>${subscribers.length}</b><span>إجمالي المشتركين</span></div>
    <div class="a-card"><b>${totalCollected.toLocaleString('ar')}</b><span>إجمالي المحصّل</span></div>
    <div class="a-card"><b>${totalExpected.toLocaleString('ar')}</b><span>إجمالي المتوقع</span></div>
    <div class="a-card"><b>${totalDebt.toLocaleString('ar')}</b><span>إجمالي الديون</span></div>`;

  const active = subscribers.filter(s => getStatus(s) === 'active').length;
  const soon = subscribers.filter(s => getStatus(s) === 'soon').length;
  const expired = subscribers.filter(s => getStatus(s) === 'expired').length;

  const typeCounts = {};
  subscribers.forEach(s => { const t = s.type || 'غير محدد'; typeCounts[t] = (typeCounts[t] || 0) + 1; });

  if(statusChartInstance) statusChartInstance.destroy();
  if(typeChartInstance) typeChartInstance.destroy();

  const gold = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim() || '#E8A33D';

  statusChartInstance = new Chart(document.getElementById('statusChart'), {
    type: 'doughnut',
    data: {
      labels: ['نشط', 'قارب الانتهاء', 'منتهي'],
      datasets: [{ data: [active, soon, expired], backgroundColor: ['#4FAE83', gold, '#C1584B'] }]
    },
    options: { plugins: { legend: { labels: { color: '#F4F1EA' } } } }
  });

  typeChartInstance = new Chart(document.getElementById('typeChart'), {
    type: 'bar',
    data: {
      labels: Object.keys(typeCounts),
      datasets: [{ label: 'عدد المشتركين', data: Object.values(typeCounts), backgroundColor: gold }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#A9B6CC' }, grid: { color: '#2B3F5E' } },
        y: { ticks: { color: '#A9B6CC' }, grid: { color: '#2B3F5E' }, beginAtZero: true }
      }
    }
  });

  document.getElementById('analyticsOverlay').classList.add('open');
}
document.getElementById('openAnalytics').addEventListener('click', openAnalyticsModal);
document.getElementById('closeAnalytics').addEventListener('click', () => document.getElementById('analyticsOverlay').classList.remove('open'));

document.getElementById('search').addEventListener('input', (e) => { searchTerm = e.target.value; renderList(); });
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    renderList();
  });
});
</script>
